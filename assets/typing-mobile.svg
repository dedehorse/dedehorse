<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120" role="img"><title>Build. Model. Debug. Repeat.</title><style>.line{animation:fade 1.2s ease-in both}.second{animation-delay:.6s}@keyframes fade{from{opacity:.15}to{opacity:1}}@media(prefers-reduced-motion:reduce){.line{animation:none}}</style><text class="line" x="250" y="48" text-anchor="middle" font-family="Consolas,monospace" font-size="39" font-weight="700" fill="#ff9cbc">Build. Model.</text><text class="line second" x="250" y="98" text-anchor="middle" font-family="Consolas,monospace" font-size="39" font-weight="700" fill="#bda1ff">Debug. Repeat.</text></svg>