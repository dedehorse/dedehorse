<svg xmlns="http://www.w3.org/2000/svg" width="640" height="255" viewBox="0 0 640 255" role="img"><title>智能车沿赛道行驶，车载摄像头扫描前方</title><style>
 #car{animation:drive 7s linear infinite}
 #wheel1,#wheel2{animation:spin .55s linear infinite;transform-origin:center;transform-box:fill-box}
 #scan{animation:pulse 1.4s ease-in-out infinite alternate}
 #track{animation:lane .9s linear infinite}
 @keyframes drive{from{transform:translateX(32px)}to{transform:translateX(347px)}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes pulse{to{opacity:.22}}
 @keyframes lane{to{stroke-dashoffset:-48}}
 @media(prefers-reduced-motion:reduce){#car{animation:none;transform:translateX(189px)}#wheel1,#wheel2,#scan,#track{animation:none}}
