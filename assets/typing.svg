<svg xmlns="http://www.w3.org/2000/svg" width="800" height="70" viewBox="0 0 800 70" role="img"><title>Build. Model. Debug. Repeat. — Always learning.</title><style>.reveal{animation:type 3s steps(29,end) 1 both}@keyframes type{from{width:0}to{width:700px}}@media(prefers-reduced-motion:reduce){.reveal{animation:none;width:700px}}</style><defs><clipPath id="type"><rect class="reveal" x="50" y="0" width="700" height="70"/></clipPath></defs><g clip-path="url(#type)"><text x="400" y="43" text-anchor="middle" font-family="Consolas,monospace" font-size="28" font-weight="600" fill="#9d8cfa">Build. Model. Debug. Repeat.</text></g></svg>